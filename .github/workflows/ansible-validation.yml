name: Ansible validation

on:
  push:
    paths:
      - "ansible/**"
      - "deploy/compose/**"
      - "Makefile"
      - ".github/workflows/ansible-validation.yml"
  pull_request:
    paths:
      - "ansible/**"
      - "deploy/compose/**"
      - "Makefile"
      - ".github/workflows/ansible-validation.yml"

jobs:
  ansible:
    name: Ansible lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install ansible-lint
        run: python -m pip install --upgrade ansible-lint

      - name: Install Ansible collections
        run: make ansible-install-requirements

      - name: Run ansible-lint
        run: make ansible-lint
