name: CI validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.filter.outputs.config }}
      terraform: ${{ steps.filter.outputs.terraform }}
      ansible: ${{ steps.filter.outputs.ansible }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            config:
              - "terraform/config/*.json"
              - "schemas/terraform-config/**"
              - "scripts/validate-json-configs.sh"
              - "scripts/validate-terraform-config-semantics.py"
              - "Makefile"
              - ".github/workflows/ci-validation.yml"
            terraform:
              - "terraform/**"
              - "ci/aws/**"
              - "scripts/terraform-validate-local.sh"
              - "Makefile"
              - ".github/workflows/ci-validation.yml"
            ansible:
              - "ansible/**"
              - "deploy/compose/**"
              - "scripts/ansible-lint-local.sh"
              - "Makefile"
              - ".github/workflows/ci-validation.yml"

  config:
    name: Config validation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.config == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install validator
        run: python -m pip install --upgrade check-jsonschema

      - name: Validate Terraform JSON configs
        run: make config-validate

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.terraform == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.2"

      - name: Validate Terraform
        run: make terraform-validate

  ansible:
    name: Ansible validation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ansible == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install ansible-lint
        run: python -m pip install --upgrade ansible-lint

      - name: Install Ansible collections
        run: make ansible-install-requirements

      - name: Run ansible-lint
        run: make ansible-lint

  trigger-aws-codepipeline:
    name: Trigger AWS CodePipeline
    runs-on: ubuntu-latest
    needs:
      - changes
      - config
      - terraform
      - ansible
    if: >-
      ${{
        always()
        && github.event_name == 'push'
        && vars.AWS_CODEPIPELINE_TRIGGER_ROLE_ARN != ''
        && github.repository == (vars.AWS_CODEPIPELINE_TRIGGER_REPOSITORY || 'hrenchevskyi-d/coin-ops-aws-code-build')
        && github.ref == format('refs/heads/{0}', vars.AWS_CODEPIPELINE_TRIGGER_BRANCH || 'hrenchevskyi-codebuild')
        && (needs.changes.outputs.config == 'true' || needs.changes.outputs.terraform == 'true' || needs.changes.outputs.ansible == 'true')
        && !contains(needs.*.result, 'failure')
        && !contains(needs.*.result, 'cancelled')
      }}

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      AWS_CODEPIPELINE_NAME: ${{ vars.AWS_CODEPIPELINE_NAME || 'coin-ops-k3s-plan' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_CODEPIPELINE_TRIGGER_ROLE_ARN }}

      - name: Start AWS CodePipeline
        run: |
          aws codepipeline start-pipeline-execution \
            --name "$AWS_CODEPIPELINE_NAME" \
            --region "$AWS_REGION"
