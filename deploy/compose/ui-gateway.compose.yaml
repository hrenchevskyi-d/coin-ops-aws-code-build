services:
  # UI image is pulled from GHCR; nginx config is rendered by the ui role.
  ui:
    image: "{{ ui_image }}"
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      PROXY_URL: /api
      HISTORY_URL: /history-api
    volumes:
      - /opt/cognitor/ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/cognitor/tls:/etc/nginx/tls:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
