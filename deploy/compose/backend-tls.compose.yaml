services:
  # Internal TLS keeps app-1 to app-2 traffic encrypted on private networks.
  backend-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - /opt/cognitor/backend-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/cognitor/internal-tls:/etc/nginx/internal-tls:ro
