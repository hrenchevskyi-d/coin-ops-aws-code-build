---
# Headlamp on EKS uses the same workload roles as k3s, but the kubeconfig comes
# from Terraform's EKS artifact instead of a tunneled k3s control plane.
- name: Install Headlamp on EKS
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    cloud: aws
  pre_tasks:
    - name: Resolve runtime configuration for EKS Headlamp deployment
      include_role:
        name: runtime_config
        public: true
      tags: [runtime_config, headlamp, eks]
    - name: Resolve EKS kubeconfig for Headlamp deployment
      include_role:
        name: k3s_kubeconfig_access
      tags: [runtime_config, headlamp, kubeconfig, eks]
  roles:
    - eks_public_ingress
    - k3s_headlamp
    - k3s_headlamp_tunnel
    - role: k3s_cloudwatch_logs
      vars:
        k3s_cloudwatch_logs_namespace: coinops-cloudwatch
        k3s_cloudwatch_logs_service_account: coinops-fluent-bit
        k3s_cloudwatch_logs_config_name: coinops-fluent-bit-config
        k3s_cloudwatch_logs_daemonset_name: coinops-fluent-bit
        k3s_cloudwatch_logs_state_dir: /var/lib/coinops-fluent-bit
        k3s_cloudwatch_logs_stream_prefix: eks/
