---
# Workloads are applied from localhost using the exported kubeconfig.
- name: Validate Coin-Ops k3s prerequisites
  hosts: localhost
  connection: local
  gather_facts: false
  pre_tasks:
    - name: Resolve runtime configuration for Coin-Ops deployment validation
      include_role:
        name: runtime_config
        public: true
      tags: [runtime_config, coinops]
  tasks:
    - name: Assert that a k3s control plane group exists
      assert:
        that:
          - "'role_k3s_server' in groups"
          - (groups['role_k3s_server'] | length) > 0
        fail_msg: >-
          Coin-Ops k3s deployment requires at least one host in role_k3s_server.

    # App images come from GHCR; database bootstrap stays in this repo.
    # RabbitMQ/Redis remains rollback-only.
    - name: Assert Coin-Ops k3s runtime prerequisites
      assert:
        that:
          - deploy_config.coinops_runtime_backend | default('postgres') == 'postgres'
          - registry_username | length > 0
          - registry_token | length > 0
          - db_password | length > 0
          - postgres_runtime_image | length > 0
          - postgres_runtime_image is regex('.+:[0-9]+([._-].+)?$')
        fail_msg: >-
          Coin-Ops k3s deployment currently expects runtime_backend=postgres,
          private registry credentials, a DB password resolved from the configured
          secret backend, and a postgres_runtime_image whose tag starts with a
          PostgreSQL major version such as 16-shabat-latest.

- name: Install Coin-Ops on k3s
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  pre_tasks:
    - name: Resolve runtime configuration for Coin-Ops deployment
      include_role:
        name: runtime_config
        public: true
      tags: [runtime_config, coinops]
    - name: Resolve effective kubeconfig for Coin-Ops deployment
      include_role:
        name: k3s_kubeconfig_access
      tags: [runtime_config, coinops, kubeconfig]
    # Catch a stale tunneled kubeconfig before Helm/K8s writes start.
    - name: Confirm Kubernetes API is reachable from localhost
      kubernetes.core.k8s_info:
        kubeconfig: "{{ k3s_effective_kubeconfig_path }}"
        api_version: v1
        kind: Namespace
        name: kube-system
      register: k3s_coinops_kube_system
      retries: 30
      delay: 5
      until: (k3s_coinops_kube_system.resources | default([]) | length) > 0
      tags: [coinops, k3s]
  roles:
    - k3s_coinops_data
    - k3s_coinops_app
    - k3s_coinops_ui
