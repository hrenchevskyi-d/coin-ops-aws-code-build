---
- name: Validate Headlamp deployment contract
  hosts: localhost
  connection: local
  gather_facts: no
  pre_tasks:
    - name: Resolve runtime configuration for Headlamp validation
      include_role:
        name: runtime_config
  tasks:
    - name: Assert that a k3s control plane group exists
      assert:
        that:
          - "'role_k3s_server' in groups"
          - (groups['role_k3s_server'] | length) > 0
        fail_msg: >-
          Headlamp deployment requires at least one host in role_k3s_server.

- name: Install Headlamp and prepare operator access artifacts
  hosts: "{{ groups.get('role_k3s_server', ['localhost']) | sort | first }}"
  become: yes
  gather_facts: no
  pre_tasks:
    - name: Resolve runtime configuration for Headlamp deployment
      include_role:
        name: runtime_config
  roles:
    - k3s_headlamp
