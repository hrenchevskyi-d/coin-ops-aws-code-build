---
# Headlamp is managed from localhost through the exported kubeconfig.
- name: Validate Headlamp prerequisites
  hosts: localhost
  connection: local
  gather_facts: no
  pre_tasks:
    - name: Resolve runtime configuration for Headlamp validation
      include_role:
        name: runtime_config
        public: true
      tags: [runtime_config, headlamp]
  tasks:
    - name: Assert that a k3s control plane group exists
      assert:
        that:
          - "'role_k3s_server' in groups"
          - (groups['role_k3s_server'] | length) > 0
        fail_msg: >-
          Headlamp deployment requires at least one host in role_k3s_server.

- name: Install Headlamp and write local access files
  hosts: localhost
  connection: local
  become: false
  gather_facts: no
  pre_tasks:
    - name: Resolve runtime configuration for Headlamp deployment
      include_role:
        name: runtime_config
        public: true
      tags: [runtime_config, headlamp]
    - name: Resolve effective kubeconfig for Headlamp deployment
      include_role:
        name: k3s_kubeconfig_access
      tags: [runtime_config, headlamp, kubeconfig]
  roles:
    - k3s_headlamp
    - k3s_headlamp_tunnel
