---
# Three-server k3s control plane. Use a separate lab config for single-node tests.
- name: Validate k3s cluster prerequisites
  hosts: localhost
  connection: local
  gather_facts: no
  pre_tasks:
    - name: Resolve runtime configuration for k3s validation
      include_role:
        name: runtime_config
        public: true
      tags: [runtime_config]
  tasks:
    - name: Assert that exactly three k3s server nodes are present
      assert:
        that:
          - "'role_k3s_server' in groups"
          - (groups['role_k3s_server'] | length) == 3
        fail_msg: >-
          The k3s bootstrap flow expects exactly three hosts in role_k3s_server.

- name: Prepare k3s server nodes
  hosts: role_k3s_server
  become: yes
  gather_facts: no
  serial: 3
  pre_tasks:
    - name: Resolve runtime configuration for k3s preparation
      include_role:
        name: runtime_config
        public: true
      tags: [runtime_config, k3s]
    - name: Wait for SSH to become stable after instance boot
      wait_for_connection:
        timeout: "{{ provisioning_wait_for_connection_timeout | default(600) }}"
        connect_timeout: 10
        sleep: "{{ provisioning_wait_for_connection_sleep | default(5) }}"
        delay: "{{ provisioning_wait_for_connection_delay | default(5) }}"

    - name: Gather facts after SSH stabilizes
      setup:
  roles:
    - common
    - k3s_prereqs

# Sorting makes the bootstrap node deterministic across dynamic inventories.
- name: Bootstrap the first k3s server
  hosts: "{{ groups.get('role_k3s_server', ['localhost']) | sort | first }}"
  become: yes
  gather_facts: no
  pre_tasks:
    - name: Resolve runtime configuration for k3s bootstrap
      include_role:
        name: runtime_config
        public: true
      tags: [runtime_config, k3s, k3s_bootstrap]
  roles:
    - k3s_server_bootstrap

- name: Join the remaining k3s servers
  hosts: role_k3s_server
  become: yes
  gather_facts: no
  pre_tasks:
    - name: Resolve runtime configuration for k3s join
      include_role:
        name: runtime_config
        public: true
      tags: [runtime_config, k3s, k3s_join]
  tasks:
    - name: Join non-bootstrap servers to the control plane
      include_role:
        name: k3s_server_join
      when: inventory_hostname != (groups.get('role_k3s_server', ['localhost']) | sort | first)

- name: Configure packaged Traefik on all k3s servers
  hosts: role_k3s_server
  become: yes
  gather_facts: no
  pre_tasks:
    - name: Resolve runtime configuration for Traefik customization
      include_role:
        name: runtime_config
        public: true
      tags: [runtime_config, k3s, traefik]
  roles:
    - k3s_traefik

# Postcheck writes kubeconfigs used by later localhost roles.
- name: Validate the finished cluster and export kubeconfig
  hosts: "{{ groups.get('role_k3s_server', ['localhost']) | sort | first }}"
  become: yes
  gather_facts: no
  pre_tasks:
    - name: Resolve runtime configuration for k3s postcheck
      include_role:
        name: runtime_config
        public: true
      tags: [runtime_config, k3s, k3s_postcheck]
  roles:
    - k3s_postcheck

- name: Configure k3s CloudWatch container logs
  hosts: localhost
  connection: local
  gather_facts: no
  pre_tasks:
    - name: Resolve runtime configuration for k3s CloudWatch logs
      include_role:
        name: runtime_config
        public: true
      tags: [runtime_config, k3s, cloudwatch, logs]
  roles:
    - k3s_cloudwatch_logs
