ui:
  name: coinops-ui
  serviceAccountName: coinops-ui
  imagePullSecretName: ghcr-pull-secret
  image: ""
  servicePort: 80
  proxyServiceName: coinops-proxy
  proxyServiceNamespace: coinops-app
  proxyServicePort: 8080
  historyServiceName: coinops-history-api
  historyServiceNamespace: coinops-app
  historyServicePort: 8000

  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
