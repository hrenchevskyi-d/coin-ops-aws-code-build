# Prebuilt UI image; chart handles nginx config mount and resource limits.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.ui.name }}
  labels:
{{ include "coinops-ui.labels" . | indent 4 }}
    app.kubernetes.io/name: {{ .Values.ui.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.ui.name }}
  template:
    metadata:
      labels:
{{ include "coinops-ui.labels" . | indent 8 }}
        app.kubernetes.io/name: {{ .Values.ui.name }}
    spec:
      securityContext:
{{ toYaml .Values.ui.podSecurityContext | indent 8 }}
      serviceAccountName: {{ .Values.ui.serviceAccountName }}
      imagePullSecrets:
        - name: {{ .Values.ui.imagePullSecretName }}
      initContainers:
        - name: copy-ui-assets
          image: {{ .Values.ui.image }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - cp -a /usr/share/nginx/html/. /workdir/
          securityContext:
{{ toYaml .Values.ui.securityContext | indent 12 }}
          volumeMounts:
            - name: ui-html
              mountPath: /workdir
      containers:
        - name: ui
          image: {{ .Values.ui.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
{{ toYaml .Values.ui.securityContext | indent 12 }}
          env:
            - name: PROXY_URL
              value: /api
            - name: HISTORY_URL
              value: /history-api
          resources:
{{ toYaml .Values.ui.resources | indent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.containerPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: ui-html
              mountPath: /usr/share/nginx/html
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-config
          configMap:
            name: {{ .Values.ui.name }}-nginx
        - name: ui-html
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
