# Prebuilt UI image; chart handles nginx config mount and resource limits.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.ui.name }}
  labels:
{{ include "coinops-ui.labels" . | indent 4 }}
    app.kubernetes.io/name: {{ .Values.ui.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.ui.name }}
  template:
    metadata:
      labels:
{{ include "coinops-ui.labels" . | indent 8 }}
        app.kubernetes.io/name: {{ .Values.ui.name }}
    spec:
      serviceAccountName: {{ .Values.ui.serviceAccountName }}
      imagePullSecrets:
        - name: {{ .Values.ui.imagePullSecretName }}
      containers:
        - name: ui
          image: {{ .Values.ui.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: PROXY_URL
              value: /api
            - name: HISTORY_URL
              value: /history-api
          resources:
{{ toYaml .Values.ui.resources | indent 12 }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: {{ .Values.ui.name }}-nginx
