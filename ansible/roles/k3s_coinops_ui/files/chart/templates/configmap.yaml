# Same-origin routing is intentional: browser calls stay on /api and
# /history-api while nginx talks to private ClusterIP services.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.ui.name }}-nginx
  labels:
{{ include "coinops-ui.labels" . | indent 4 }}
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri /index.html;
        }

        location = /health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok"}';
        }

        # Keep frontend runtime config simple by preserving same-origin API paths.
        location /api/ {
            proxy_pass http://{{ .Values.ui.proxyServiceName }}.{{ .Values.ui.proxyServiceNamespace }}.svc.cluster.local:{{ .Values.ui.proxyServicePort }}/;
            proxy_http_version 1.1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /history-api/ {
            proxy_pass http://{{ .Values.ui.historyServiceName }}.{{ .Values.ui.historyServiceNamespace }}.svc.cluster.local:{{ .Values.ui.historyServicePort }}/;
            proxy_http_version 1.1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        gzip on;
        gzip_types text/html text/css application/javascript application/json;
    }

