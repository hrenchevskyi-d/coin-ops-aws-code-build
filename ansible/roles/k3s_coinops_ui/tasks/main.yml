---
# UI chart deploys the prebuilt UI image and same-origin nginx routing.
- name: k3s-coinops-ui-install-helm-client
  include_role:
    name: k3s_helm_client
  when: k3s_coinops_ui_enabled | bool
  tags: [coinops, k3s, ui, helm]

- name: k3s-coinops-ui-install-cert-manager
  include_role:
    name: k3s_cert_manager
  when: k3s_coinops_ui_tls_enabled | bool
  tags: [coinops, k3s, ui, cert_manager, tls]

- name: k3s-coinops-ui-configure-acme-cloudflare-issuer
  include_role:
    name: k3s_acme_cloudflare
  when: k3s_coinops_ui_tls_enabled | bool
  tags: [coinops, k3s, ui, cert_manager, tls]

- name: k3s-coinops-ui-clear-staged-helm-chart
  file:
    path: "{{ k3s_coinops_ui_chart_staging_dir }}"
    state: absent
  when: k3s_coinops_ui_enabled | bool
  tags: [coinops, k3s, ui, helm]

- name: k3s-coinops-ui-stage-helm-chart
  copy:
    src: "{{ k3s_coinops_ui_chart_source_dir }}/"
    dest: "{{ k3s_coinops_ui_chart_staging_dir }}/"
  when: k3s_coinops_ui_enabled | bool
  tags: [coinops, k3s, ui, helm]

- name: k3s-coinops-ui-render-helm-values
  template:
    src: coinops-ui-values.yaml.j2
    dest: "{{ k3s_coinops_ui_chart_values_path }}"
    mode: "0600"
  when: k3s_coinops_ui_enabled | bool
  tags: [coinops, k3s, ui, helm]

- name: k3s-coinops-ui-ensure-namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_effective_kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ k3s_coinops_ui_namespace }}"
        labels: "{{ k3s_coinops_ui_namespace_labels | combine((k3s_coinops_ui_pod_security_enforce | bool) | ternary({\"pod-security.kubernetes.io/enforce\": \"restricted\", \"pod-security.kubernetes.io/enforce-version\": k3s_coinops_ui_pod_security_enforce_version}, {})) }}"
  when: k3s_coinops_ui_enabled | bool
  tags: [coinops, k3s, ui]

- name: k3s-coinops-ui-apply-registry-secret
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_effective_kubeconfig_path }}"
    state: present
    definition: "{{ lookup('template', 'coinops-ui-pull-secret.yaml.j2') | from_yaml }}"
  no_log: true
  when: k3s_coinops_ui_enabled | bool
  tags: [coinops, k3s, ui, secrets]

- name: k3s-coinops-ui-install-or-upgrade-release
  kubernetes.core.helm:
    name: "{{ k3s_coinops_ui_release_name }}"
    chart_ref: "{{ k3s_coinops_ui_chart_staging_dir }}"
    release_namespace: "{{ k3s_coinops_ui_namespace }}"
    create_namespace: true
    kubeconfig: "{{ k3s_effective_kubeconfig_path }}"
    wait: false
    force: true
    values_files:
      - "{{ k3s_coinops_ui_chart_values_path }}"
  when: k3s_coinops_ui_enabled | bool
  tags: [coinops, k3s, ui, helm]

- name: k3s-coinops-ui-reapply-registry-secret-after-helm-upgrade
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_effective_kubeconfig_path }}"
    state: present
    definition: "{{ lookup('template', 'coinops-ui-pull-secret.yaml.j2') | from_yaml }}"
  no_log: true
  when: k3s_coinops_ui_enabled | bool
  tags: [coinops, k3s, ui, secrets]

- name: k3s-coinops-ui-read-deployment-status
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k3s_effective_kubeconfig_path }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ k3s_coinops_ui_namespace }}"
    name: "{{ k3s_coinops_ui_app_name }}"
  register: k3s_coinops_ui_deployment_info
  retries: "{{ k3s_coinops_ui_wait_retries }}"
  delay: "{{ k3s_coinops_ui_wait_delay }}"
  until: >-
    (
      k3s_coinops_ui_deployment_info.resources | default([]) | length
    ) > 0 and
    (
      k3s_coinops_ui_deployment_info.resources[0].status.availableReplicas | default(0) | int
    ) >= 1
  when: k3s_coinops_ui_enabled | bool
  tags: [coinops, k3s, ui]

# Apply Ingress after Service so certificate checks use the final endpoint.
- name: k3s-coinops-ui-configure-ingress-and-certificate
  include_role:
    name: k3s_ingress_endpoint
  vars:
    k3s_ingress_endpoint_name: "{{ k3s_coinops_ui_app_name }}"
    k3s_ingress_endpoint_namespace: "{{ k3s_coinops_ui_namespace }}"
    k3s_ingress_endpoint_class_name: "{{ k3s_coinops_ui_ingress_class_name }}"
    k3s_ingress_endpoint_host: "{{ k3s_coinops_ui_hostname }}"
    k3s_ingress_endpoint_service_name: "{{ k3s_coinops_ui_app_name }}"
    k3s_ingress_endpoint_service_port: "{{ k3s_coinops_ui_service_port }}"
    k3s_ingress_endpoint_tls_enabled: "{{ k3s_coinops_ui_tls_enabled | bool }}"
    k3s_ingress_endpoint_tls_secret_name: "{{ k3s_coinops_ui_tls_secret_name }}"
    k3s_ingress_endpoint_certificate_name: "{{ k3s_coinops_ui_certificate_name }}"
    k3s_ingress_endpoint_cluster_issuer_name: "{{ k3s_acme_cloudflare_cluster_issuer_name | default('letsencrypt-dns-cloudflare') }}"
  when:
    - k3s_coinops_ui_enabled | bool
    - k3s_coinops_ui_ingress_enabled | bool
  tags: [coinops, k3s, ui]

