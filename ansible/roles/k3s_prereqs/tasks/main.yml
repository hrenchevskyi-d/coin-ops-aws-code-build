---
- name: Install k3s prerequisite packages
  apt:
    name:
      - ca-certificates
    state: present
    lock_timeout: "{{ provisioning_apt_lock_timeout | default(900) }}"

- name: Ensure required kernel modules load at boot
  copy:
    dest: /etc/modules-load.d/k3s.conf
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Load overlay kernel module
  community.general.modprobe:
    name: overlay
    state: present

- name: Load br_netfilter kernel module
  community.general.modprobe:
    name: br_netfilter
    state: present

- name: Configure sysctl settings for Kubernetes networking
  copy:
    dest: /etc/sysctl.d/90-k3s.conf
    mode: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1

- name: Apply sysctl settings
  command: sysctl --system
  changed_when: false

- name: Disable active swap
  command: swapoff -a
  changed_when: false

- name: Disable swap in fstab
  replace:
    path: /etc/fstab
    regexp: '^(?!#)(.*\sswap\s+.*)$'
    replace: '# \1'

- name: Ensure Rancher config directory exists
  file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Allow flannel UDP traffic through UFW when present
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: udp
  loop: "{{ k3s_udp_ports }}"
  when: ufw_binary.stat.exists
