---
# Helm is installed on the operator/controller context used by these roles. The
# script is idempotent through creates=/usr/local/bin/helm.
- name: Download Helm installation script
  get_url:
    url: "{{ k3s_helm_client_install_script_url }}"
    dest: /tmp/get-helm-3.sh
    mode: "0755"

- name: Install Helm on bootstrap node when missing
  command: /tmp/get-helm-3.sh
  args:
    creates: /usr/local/bin/helm
