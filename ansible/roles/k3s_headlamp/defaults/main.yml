---
k3s_headlamp_tls_enabled: "{{ tls_mode == 'certbot' }}"
k3s_headlamp_tls_secret_name: headlamp-tls
k3s_headlamp_certificate_name: headlamp-tls
k3s_headlamp_release_name: headlamp
k3s_headlamp_namespace: kube-system
k3s_headlamp_chart_repo_name: headlamp
k3s_headlamp_chart_repo_url: https://kubernetes-sigs.github.io/headlamp/
k3s_headlamp_chart_ref: headlamp/headlamp
k3s_headlamp_admin_service_account: headlamp-admin
k3s_headlamp_admin_cluster_role: cluster-admin
k3s_headlamp_local_port: 8080
k3s_headlamp_ingress_enabled: "{{ deploy_config.headlamp_ingress_enabled | default(true) | bool }}"
k3s_headlamp_ingress_host: "{{ deploy_config.headlamp_hostname | default('headlamp.' ~ app_domain) }}"
k3s_headlamp_ingress_class_name: "{{ deploy_config.headlamp_ingress_class_name | default('traefik') }}"
k3s_headlamp_local_artifact_dir: "{{ repo_root ~ '/ansible/artifacts' }}"
