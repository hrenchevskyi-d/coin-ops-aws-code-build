---
- name: Install Helm client
  include_role:
    name: k3s_helm_client
  tags: [headlamp, k3s, helm]

- name: Install cert-manager
  include_role:
    name: k3s_cert_manager
  when: headlamp_tls_enabled | bool
  tags: [headlamp, k3s, cert_manager, tls]

- name: Configure ACME Cloudflare issuer
  include_role:
    name: k3s_acme_cloudflare
  when: headlamp_tls_enabled | bool
  tags: [headlamp, k3s, cert_manager, tls]

- name: Deploy Headlamp workload
  include_role:
    name: k3s_headlamp_app
  tags: [headlamp, k3s]

- name: Configure Headlamp ingress and certificate
  include_role:
    name: k3s_ingress_endpoint
  vars:
    ingress_endpoint_name: "{{ headlamp_release_name }}"
    ingress_endpoint_namespace: "{{ headlamp_namespace }}"
    ingress_endpoint_class_name: "{{ headlamp_ingress_class_name }}"
    ingress_endpoint_host: "{{ headlamp_ingress_host }}"
    ingress_endpoint_service_name: "{{ headlamp_release_name }}"
    ingress_endpoint_service_port: "{{ headlamp_service_port }}"
    ingress_endpoint_tls_enabled: "{{ headlamp_tls_enabled | bool }}"
    ingress_endpoint_tls_secret_name: "{{ headlamp_tls_secret_name }}"
    ingress_endpoint_certificate_name: "{{ headlamp_certificate_name }}"
    ingress_endpoint_cluster_issuer_name: "{{ acme_cluster_issuer_name }}"
  tags: [headlamp, k3s]

- name: Render local operator artifacts
  include_role:
    name: k3s_operator_artifacts
  tags: [headlamp, k3s, artifacts]
