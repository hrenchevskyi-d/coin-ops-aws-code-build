---
# Gateway order matters: sysctl first, NAT persistence second, tailscale up last.
# Otherwise advertised subnet routes may work before return traffic is masqueraded.
- name: Install gateway dependencies
  include_tasks: install.yml
  tags: [tailscale]

- name: Configure host routing prerequisites
  include_tasks: configure.yml
  tags: [tailscale]

- name: Configure NAT persistence
  include_tasks: nat.yml
  tags: [tailscale]

- name: Configure Tailscale subnet routing
  include_tasks: tailscale.yml
  tags: [tailscale]
