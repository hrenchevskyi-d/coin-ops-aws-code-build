---
k3s_coinops_data_enabled: "{{ deploy_config.coinops_enabled | default(true) | bool }}"
k3s_coinops_data_namespace: coinops-data
k3s_coinops_data_cluster_name: coinops-postgres
k3s_coinops_data_instances: 2
k3s_coinops_data_storage_size: 2Gi
k3s_coinops_data_postgres_image: "{{ postgres_runtime_image }}"
k3s_coinops_data_postgres_uid: 70
k3s_coinops_data_postgres_gid: 70
k3s_coinops_data_database_name: "{{ db_name }}"
k3s_coinops_data_app_user: "{{ db_user }}"
k3s_coinops_data_app_role: "{{ k3s_coinops_data_app_user }}"
k3s_coinops_data_superuser_secret_name: coinops-postgres-superuser
k3s_coinops_data_app_secret_name: coinops-postgres-app
k3s_coinops_data_runtime_configmap_name: coinops-postgres-runtime
k3s_coinops_data_bootstrap_job_name: coinops-postgres-runtime-bootstrap
k3s_coinops_data_registry_pull_secret_name: ghcr-pull-secret
k3s_coinops_data_cnpg_operator_config_name: cnpg-controller-manager-config
k3s_coinops_data_cnpg_namespace: cnpg-system
# These files are read from deploy/sql/runtime and mounted into the bootstrap job.
k3s_coinops_data_runtime_sql_files:
  - 00_run_all.sql
  - 01_schema.sql
  - 02_wrappers.sql
  - 03_notify.sql
  - 04_advisory.sql
  - 05_dlq.sql
  - 06_cache_schema.sql
  - 07_cache_wrappers.sql
  - 08_cron.sql


k3s_coinops_data_namespace_labels:
  pod-security.kubernetes.io/audit: restricted
  pod-security.kubernetes.io/audit-version: latest
  pod-security.kubernetes.io/warn: restricted
  pod-security.kubernetes.io/warn-version: latest
k3s_coinops_data_pod_security_enforce: false
k3s_coinops_data_pod_security_enforce_version: latest

k3s_coinops_data_backup_enabled: '{{ cnpg_backup_metadata.get("enabled", false) | bool }}'
k3s_coinops_data_backup_provider: '{{ cnpg_backup_metadata.get("provider", "gcs") }}'
k3s_coinops_data_backup_destination_path: '{{ cnpg_backup_metadata.get("destination_path", "") }}'
k3s_coinops_data_backup_schedule: '{{ cnpg_backup_metadata.get("schedule", "0 0 2 * * *") }}'
k3s_coinops_data_backup_retention_policy: '{{ cnpg_backup_metadata.get("retention_policy", "30d") }}'
k3s_coinops_data_backup_credentials_secret_name: '{{ "coinops-cnpg-s3-backup" if k3s_coinops_data_backup_provider == "s3" else "coinops-cnpg-gcs-backup" }}'
k3s_coinops_data_backup_credentials_secret_key: '{{ "ACCESS_SECRET_KEY" if k3s_coinops_data_backup_provider == "s3" else "gcsCredentials" }}'
k3s_coinops_data_backup_s3_access_key_id_secret_key: ACCESS_KEY_ID
k3s_coinops_data_backup_s3_secret_access_key_secret_key: ACCESS_SECRET_KEY
k3s_coinops_data_backup_objectstore_name: '{{ "coinops-postgres-s3" if k3s_coinops_data_backup_provider == "s3" else "coinops-postgres-gcs" }}'
k3s_coinops_data_backup_scheduled_name: coinops-postgres-daily
k3s_coinops_data_barman_plugin_name: barman-cloud.cloudnative-pg.io
k3s_coinops_data_barman_plugin_manifest_url: https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/v0.12.0/manifest.yaml
k3s_coinops_data_barman_plugin_deployment_name: barman-cloud

# CNPG instance managers call the Kubernetes API during bootstrap/reconciliation.
# k3s defaults the kubernetes.default Service IP to 10.43.0.1, but
# NetworkPolicy enforcement can see the translated control-plane endpoint too.
k3s_coinops_data_kubernetes_api_service_cidr: 10.43.0.1/32
k3s_coinops_data_kubernetes_api_endpoint_cidr: "{{ cloud_subnets.get('internal', {}).get('cidr', '10.20.1.0/24') }}"
k3s_coinops_data_k3s_pod_cidr: "{{ deploy_config.k3s_cluster_cidr | default('10.42.0.0/16') }}"
k3s_coinops_data_k3s_service_cidr: "{{ deploy_config.k3s_service_cidr | default('10.43.0.0/16') }}"

k3s_coinops_data_bootstrap_run_as_user: 10004
k3s_coinops_data_bootstrap_run_as_group: 10004

k3s_coinops_data_wait_retries: 6
k3s_coinops_data_wait_delay: 5
