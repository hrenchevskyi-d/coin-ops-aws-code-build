---
# Bootstrap node creates the first token and initializes the datastore.
- name: Render bootstrap k3s server configuration
  template:
    dest: "{{ k3s_config_file }}"
    src: config.yaml.j2
    mode: "0600"
  register: k3s_bootstrap_config
  tags: [k3s, k3s_bootstrap]

- name: Download k3s installation script
  get_url:
    url: "{{ k3s_install_script_url }}"
    dest: /tmp/get-k3s.sh
    mode: "0755"
  tags: [k3s, k3s_bootstrap]

# Version pin wins over channel for repeatable rebuilds. Empty version keeps the
# lab path simple by following the configured k3s channel.
- name: Install bootstrap k3s server from pinned version
  command: /tmp/get-k3s.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: server
  args:
    creates: /usr/local/bin/k3s
  when: k3s_version | length > 0
  tags: [k3s, k3s_bootstrap]

- name: Install bootstrap k3s server from channel
  command: /tmp/get-k3s.sh
  environment:
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
    INSTALL_K3S_EXEC: server
  args:
    creates: /usr/local/bin/k3s
  when: k3s_version | length == 0
  tags: [k3s, k3s_bootstrap]

- name: Ensure k3s service is enabled and running on bootstrap node
  systemd:
    name: k3s
    enabled: yes
    state: started
  tags: [k3s, k3s_bootstrap]

# get-k3s.sh will not re-run after install; config changes need a restart.
- name: Restart bootstrap k3s service when configuration changes
  systemd:
    name: k3s
    state: restarted
  when: k3s_bootstrap_config.changed
  tags: [k3s, k3s_bootstrap]

- name: Wait for the k3s cluster token to be created
  wait_for:
    path: "{{ k3s_token_file }}"
    timeout: 300
  tags: [k3s, k3s_bootstrap]

- name: Read the k3s cluster token
  slurp:
    src: "{{ k3s_token_file }}"
  register: k3s_bootstrap_token_raw
  tags: [k3s, k3s_bootstrap]

# set_fact stores the token on the bootstrap hostvars for the same playbook run;
# it is not written to local artifacts.
- name: Store the k3s cluster token for join nodes
  set_fact:
    k3s_cluster_token: "{{ k3s_bootstrap_token_raw.content | b64decode | trim }}"
  tags: [k3s, k3s_bootstrap]

- name: Wait until the bootstrap API responds
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    kind: Node
  register: k3s_bootstrap_nodes
  retries: 20
  delay: 10
  until: (k3s_bootstrap_nodes.resources | default([]) | length) > 0
  tags: [k3s, k3s_bootstrap]
