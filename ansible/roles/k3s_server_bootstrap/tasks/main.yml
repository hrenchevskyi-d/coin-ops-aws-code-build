---
- name: Render bootstrap k3s server configuration
  copy:
    dest: "{{ k3s_config_file }}"
    mode: "0600"
    content: |
      cluster-init: true
      write-kubeconfig-mode: "{{ k3s_write_kubeconfig_mode }}"
      node-name: "{{ inventory_hostname }}"
      tls-san:
        - "{{ ansible_host }}"
      flannel-backend: "{{ k3s_flannel_backend }}"
      disable:
      {% for component in k3s_server_disable_components %}
        - {{ component }}
      {% endfor %}
  register: k3s_bootstrap_config

- name: Download k3s installation script
  get_url:
    url: "{{ k3s_install_script_url }}"
    dest: /tmp/get-k3s.sh
    mode: "0755"

- name: Install bootstrap k3s server
  command: /tmp/get-k3s.sh
  environment:
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
    INSTALL_K3S_EXEC: server
  args:
    creates: /usr/local/bin/k3s

- name: Ensure k3s service is enabled and running on bootstrap node
  systemd:
    name: k3s
    enabled: yes
    state: started

- name: Restart bootstrap k3s service when configuration changes
  systemd:
    name: k3s
    state: restarted
  when: k3s_bootstrap_config.changed

- name: Wait for the k3s cluster token to be created
  wait_for:
    path: "{{ k3s_token_file }}"
    timeout: 300

- name: Read the k3s cluster token
  slurp:
    src: "{{ k3s_token_file }}"
  register: k3s_bootstrap_token_raw

- name: Store the k3s cluster token for join nodes
  set_fact:
    k3s_cluster_token: "{{ k3s_bootstrap_token_raw.content | b64decode | trim }}"

- name: Wait until the bootstrap API responds
  command: k3s kubectl get nodes -o name
  register: k3s_bootstrap_nodes
  changed_when: false
  retries: 20
  delay: 10
  until: k3s_bootstrap_nodes.rc == 0
