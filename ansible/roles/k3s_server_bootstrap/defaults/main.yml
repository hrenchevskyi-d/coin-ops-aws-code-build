---
k3s_bootstrap_host: "{{ groups['role_k3s_server'] | sort | first }}"
k3s_api_endpoint: "{{ cloud_runtime_metadata.get('k3s_api_endpoint', '') | default('', true) }}"
k3s_tls_sans: "{{ ([ansible_host] + ([k3s_api_endpoint] if (k3s_api_endpoint | length > 0) else [])) | unique }}"
k3s_channel: "{{ deploy_config.k3s_channel | default('stable') }}"
k3s_version: "{{ deploy_config.k3s_version | default('') }}"
k3s_install_script_url: https://get.k3s.io
k3s_disable_cloud_controller: "{{ deploy_config.k3s_disable_cloud_controller | default(false) }}"
k3s_server_disable_components: "{{ deploy_config.k3s_disable_components | default([]) }}"
k3s_flannel_backend: "{{ deploy_config.k3s_flannel_backend | default('vxlan') }}"
k3s_write_kubeconfig_mode: "0644"
k3s_token_file: /var/lib/rancher/k3s/server/node-token
k3s_config_file: /etc/rancher/k3s/config.yaml
