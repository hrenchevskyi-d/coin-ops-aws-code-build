---
# ACME DNS-01 is Cloudflare-backed so private/internal ingress can still get
# valid certificates without exposing solver HTTP endpoints.
- name: Validate Cloudflare secret availability for ACME TLS
  assert:
    that:
      - cloudflare_api_token | length > 0
    fail_msg: >-
      CLOUDFLARE_API_TOKEN must be present in the configured secret backend secret
      {{ app_secret_name }} when TLS_MODE=certbot and ACME-backed ingress TLS is enabled.

- name: Apply cert-manager Cloudflare API token secret
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_effective_kubeconfig_path }}"
    state: present
    definition: "{{ lookup('template', 'cert-manager-cloudflare-secret.yaml.j2') | from_yaml }}"
  no_log: "{{ k3s_acme_cloudflare_hide_secret_task_output | bool }}"

- name: Apply ACME ClusterIssuer
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_effective_kubeconfig_path }}"
    state: present
    definition: "{{ lookup('template', 'clusterissuer.yaml.j2') | from_yaml }}"

- name: Read ACME ClusterIssuer status
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k3s_effective_kubeconfig_path }}"
    api_version: cert-manager.io/v1
    kind: ClusterIssuer
    name: "{{ k3s_acme_cloudflare_cluster_issuer_name }}"
  register: acme_clusterissuer_info
  retries: "{{ k3s_acme_cloudflare_wait_retries }}"
  delay: "{{ k3s_acme_cloudflare_wait_delay }}"
  until: >-
    (
      acme_clusterissuer_info.resources | default([]) | length
    ) > 0 and
    (
      acme_clusterissuer_info.resources[0].status.conditions
      | default([])
      | selectattr('type', 'equalto', 'Ready')
      | map(attribute='status')
      | first
      | default('False')
    ) == 'True'
