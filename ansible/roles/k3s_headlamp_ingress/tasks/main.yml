---
- name: Apply Headlamp TLS certificate
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition: "{{ lookup('template', 'headlamp-certificate.yaml.j2') | from_yaml }}"
  when: headlamp_tls_enabled | bool

- name: Apply Headlamp ingress manifest
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition: "{{ lookup('template', 'headlamp-ingress.yaml.j2') | from_yaml }}"

- name: Read Headlamp TLS certificate status
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: cert-manager.io/v1
    kind: Certificate
    namespace: "{{ headlamp_namespace }}"
    name: "{{ headlamp_certificate_name }}"
  register: headlamp_certificate_info
  retries: 60
  delay: 10
  until: >-
    (
      headlamp_certificate_info.resources | default([]) | length
    ) > 0 and
    (
      headlamp_certificate_info.resources[0].status.conditions
      | default([])
      | selectattr('type', 'equalto', 'Ready')
      | map(attribute='status')
      | first
      | default('False')
    ) == 'True'
  when: headlamp_tls_enabled | bool
