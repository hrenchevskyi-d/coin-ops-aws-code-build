---
- name: Validate supported database/runtime combination
  assert:
    that:
      - not (use_managed_db and runtime_backend == 'postgres')
    fail_msg: "Managed PostgreSQL is not supported with RUNTIME_BACKEND=postgres yet. Use RUNTIME_BACKEND=external or disable managed DB."

- name: Validate history database secret availability
  assert:
    that:
      - db_password | length > 0
    fail_msg: "DB_PASSWORD must be present in the configured secret backend secret {{ db_secret_name }}."

- name: Validate RabbitMQ secret availability
  assert:
    that:
      - rabbitmq_password | length > 0
    fail_msg: "RABBITMQ_PASSWORD must be present in the configured secret backend secret {{ db_secret_name }} when RUNTIME_BACKEND=external."
  when: runtime_backend == 'external'

- name: Manage History API UFW port
  include_role:
    name: ufw_managed_port
  vars:
    ufw_managed_port: "{{ history_port }}"
    ufw_managed_port_enabled: "{{ not internal_tls_enabled }}"
