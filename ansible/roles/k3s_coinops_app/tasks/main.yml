---
# App workloads are deployed from frozen GHCR images through a repo-owned chart.
# This role manages Kubernetes shape, not application source.
- name: k3s-coinops-app-install-helm-client
  include_role:
    name: k3s_helm_client
  when: k3s_coinops_app_enabled | bool
  tags: [coinops, k3s, app, helm]

- name: k3s-coinops-app-stage-helm-chart
  copy:
    src: "{{ k3s_coinops_app_chart_source_dir }}/"
    dest: "{{ k3s_coinops_app_chart_staging_dir }}/"
  when: k3s_coinops_app_enabled | bool
  tags: [coinops, k3s, app, helm]

- name: k3s-coinops-app-render-helm-values
  template:
    src: coinops-app-values.yaml.j2
    dest: "{{ k3s_coinops_app_chart_values_path }}"
    mode: "0644"
  when: k3s_coinops_app_enabled | bool
  tags: [coinops, k3s, app, helm]

# Namespaces are configurable per component so proxy/API/consumer can later be
# isolated without changing the chart resource templates.
- name: k3s-coinops-app-ensure-component-namespaces
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_effective_kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ item }}"
  loop:
    - "{{ k3s_coinops_app_proxy_namespace }}"
    - "{{ k3s_coinops_app_history_api_namespace }}"
    - "{{ k3s_coinops_app_consumer_namespace }}"
  when: k3s_coinops_app_enabled | bool
  tags: [coinops, k3s, app]

- name: k3s-coinops-app-install-or-upgrade-release
  kubernetes.core.helm:
    name: "{{ k3s_coinops_app_release_name }}"
    chart_ref: "{{ k3s_coinops_app_chart_staging_dir }}"
    release_namespace: "{{ k3s_coinops_app_namespace }}"
    create_namespace: true
    kubeconfig: "{{ k3s_effective_kubeconfig_path }}"
    wait: true
    values_files:
      - "{{ k3s_coinops_app_chart_values_path }}"
  when: k3s_coinops_app_enabled | bool
  tags: [coinops, k3s, app, helm]

- name: k3s-coinops-app-read-proxy-deployment-status
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k3s_effective_kubeconfig_path }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ k3s_coinops_app_proxy_namespace }}"
    name: "{{ k3s_coinops_app_proxy_name }}"
  register: k3s_coinops_app_proxy_deployment_info
  retries: 30
  delay: 10
  until: >-
    (
      k3s_coinops_app_proxy_deployment_info.resources | default([]) | length
    ) > 0 and
    (
      k3s_coinops_app_proxy_deployment_info.resources[0].status.availableReplicas | default(0) | int
    ) >= 1
  when: k3s_coinops_app_enabled | bool
  tags: [coinops, k3s, app]

- name: k3s-coinops-app-read-history-api-deployment-status
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k3s_effective_kubeconfig_path }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ k3s_coinops_app_history_api_namespace }}"
    name: "{{ k3s_coinops_app_history_api_name }}"
  register: k3s_coinops_app_history_api_deployment_info
  retries: 30
  delay: 10
  until: >-
    (
      k3s_coinops_app_history_api_deployment_info.resources | default([]) | length
    ) > 0 and
    (
      k3s_coinops_app_history_api_deployment_info.resources[0].status.availableReplicas | default(0) | int
    ) >= 1
  when: k3s_coinops_app_enabled | bool
  tags: [coinops, k3s, app]


- name: k3s-coinops-app-read-consumer-deployment-status
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k3s_effective_kubeconfig_path }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ k3s_coinops_app_consumer_namespace }}"
    name: "{{ k3s_coinops_app_consumer_name }}"
  register: k3s_coinops_app_consumer_deployment_info
  retries: 30
  delay: 10
  until: >-
    (
      k3s_coinops_app_consumer_deployment_info.resources | default([]) | length
    ) > 0 and
    (
      k3s_coinops_app_consumer_deployment_info.resources[0].status.availableReplicas | default(0) | int
    ) >= 1
  when: k3s_coinops_app_enabled | bool
  tags: [coinops, k3s, app]
