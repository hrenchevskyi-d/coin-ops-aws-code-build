apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.historyApi.name }}
  labels:
{{ include "coinops-app.labels" . | indent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Values.historyApi.name }}
  ports:
    - name: http
      port: {{ .Values.historyApi.servicePort }}
      targetPort: http
      protocol: TCP

