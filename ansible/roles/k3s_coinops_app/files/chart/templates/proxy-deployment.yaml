# Proxy always gets DATABASE_URL; external mode also gets RabbitMQ/Redis.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.proxy.name }}
  namespace: {{ .Values.proxy.namespace }}
  labels:
{{ include "coinops-app.labels" . | indent 4 }}
    app.kubernetes.io/name: {{ .Values.proxy.name }}
spec:
  replicas: {{ .Values.proxy.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.proxy.name }}
  template:
    metadata:
      labels:
{{ include "coinops-app.labels" . | indent 8 }}
        app.kubernetes.io/name: {{ .Values.proxy.name }}
    spec:
      serviceAccountName: {{ .Values.proxy.serviceAccountName }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecretName }}
      containers:
        - name: proxy
          image: {{ .Values.proxy.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: RUNTIME_BACKEND
              value: {{ .Values.runtimeBackend | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: DATABASE_URL
            {{- if eq .Values.runtimeBackend "external" }}
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: RABBITMQ_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: REDIS_URL
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.proxy.servicePort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
          resources:
{{ toYaml .Values.proxy.resources | indent 12 }}
