apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  labels:
{{ include "coinops-app.labels" . | indent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secret.databaseUrl | quote }}
  RABBITMQ_URL: {{ .Values.secret.rabbitmqUrl | quote }}
  REDIS_URL: {{ .Values.secret.redisUrl | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imagePullSecretName }}
  labels:
{{ include "coinops-app.labels" . | indent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.imagePullSecretDockerConfigJson | quote }}
