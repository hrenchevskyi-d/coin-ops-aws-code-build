apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.historyApi.name }}
  labels:
{{ include "coinops-app.labels" . | indent 4 }}
    app.kubernetes.io/name: {{ .Values.historyApi.name }}
spec:
  replicas: {{ .Values.historyApi.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.historyApi.name }}
  template:
    metadata:
      labels:
{{ include "coinops-app.labels" . | indent 8 }}
        app.kubernetes.io/name: {{ .Values.historyApi.name }}
    spec:
      serviceAccountName: {{ .Values.historyApi.serviceAccountName }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecretName }}
      containers:
        - name: history-api
          image: {{ .Values.historyApi.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: DATABASE_URL
          ports:
            - name: http
              containerPort: {{ .Values.historyApi.servicePort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
