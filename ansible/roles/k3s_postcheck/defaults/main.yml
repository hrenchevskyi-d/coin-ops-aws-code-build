---
k3s_postcheck_local_artifact_dir: "{{ repo_root ~ '/ansible/artifacts' }}"
k3s_postcheck_cloud_slug: "{{ my_cloud | default('cluster', true) }}"
k3s_postcheck_local_kubeconfig_path: "{{ k3s_postcheck_local_artifact_dir }}/kubeconfig-{{ k3s_postcheck_cloud_slug }}-k3s.yaml"
k3s_postcheck_local_tunneled_kubeconfig_path: "{{ k3s_postcheck_local_artifact_dir }}/kubeconfig-{{ k3s_postcheck_cloud_slug }}-k3s-tunneled.yaml"
k3s_postcheck_jump_host_name: "{{ (jump_host | default('jump-host', true)) | regex_replace('^(gcp|aws|azure)-', '') }}"
k3s_postcheck_jump_host_alias: "{{ 'coinops-' ~ k3s_postcheck_cloud_slug ~ '-' ~ k3s_postcheck_jump_host_name }}"
