---
- name: Read k3s node list as JSON
  command: k3s kubectl get nodes -o json
  register: k3s_nodes_json
  changed_when: false
  retries: 20
  delay: 10
  until: k3s_nodes_json.rc == 0

- name: Parse node list payload
  set_fact:
    k3s_nodes: "{{ (k3s_nodes_json.stdout | from_json)['items'] }}"

- name: Assert that three k3s nodes are registered
  assert:
    that:
      - (k3s_nodes | length) == 3
    fail_msg: >-
      Expected 3 nodes in the k3s control plane, got {{ k3s_nodes | length }}.

- name: Assert that all k3s nodes report Ready
  assert:
    that:
      - >-
        (
          item.status.conditions
          | selectattr('type', 'equalto', 'Ready')
          | map(attribute='status')
          | first
        ) == 'True'
    fail_msg: "Node {{ item.metadata.name }} is not Ready."
  loop: "{{ k3s_nodes }}"
  loop_control:
    label: "{{ item.metadata.name }}"

- name: Read kubeconfig from bootstrap node
  slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig_raw

- name: Determine preferred Kubernetes API endpoint for operator artifacts
  set_fact:
    k3s_operator_api_endpoint: "{{ cloud_runtime_metadata.get('k3s_api_endpoint', '') | default(ansible_host, true) }}"

- name: Ensure local artifact directory exists
  command: mkdir -p "{{ k3s_local_artifact_dir }}"
  changed_when: false
  delegate_to: localhost
  become: false

- name: Write kubeconfig artifact for operator use
  copy:
    dest: "{{ k3s_local_artifact_dir }}/kubeconfig-gcp-k3s.yaml"
    mode: "0600"
    content: >-
      {{
        (k3s_kubeconfig_raw.content | b64decode)
        | regex_replace('127.0.0.1', k3s_operator_api_endpoint)
      }}
  delegate_to: localhost
  become: false

- name: Write tunneled kubeconfig artifact for operator use
  copy:
    dest: "{{ k3s_local_artifact_dir }}/kubeconfig-gcp-k3s-tunneled.yaml"
    mode: "0600"
    content: >-
      {{
        (k3s_kubeconfig_raw.content | b64decode)
        | regex_replace('https://127.0.0.1:6443', 'https://127.0.0.1:6443')
        | regex_replace('server: https://127.0.0.1:6443', 'server: https://127.0.0.1:6443\n    tls-server-name: ' ~ k3s_operator_api_endpoint)
      }}
  delegate_to: localhost
  become: false

- name: Write Kubernetes API tunnel helper
  copy:
    dest: "{{ k3s_local_artifact_dir }}/k8s-api-tunnel.sh"
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      ssh -N -L 6443:{{ k3s_operator_api_endpoint }}:6443 -F {{ repo_root }}/terraform/config/ssh_config coinops-gcp-jump-host
  delegate_to: localhost
  become: false

- name: Write cluster bootstrap summary
  copy:
    dest: "{{ k3s_local_artifact_dir }}/k3s-bootstrap-summary.txt"
    mode: "0644"
    content: |
      Bootstrap host: {{ inventory_hostname }}
      API endpoint: https://{{ ansible_host }}:6443
      HA API endpoint: https://{{ k3s_operator_api_endpoint }}:6443
      Kubeconfig: {{ k3s_local_artifact_dir }}/kubeconfig-gcp-k3s.yaml
      Tunneled kubeconfig: {{ k3s_local_artifact_dir }}/kubeconfig-gcp-k3s-tunneled.yaml
      API tunnel helper: {{ k3s_local_artifact_dir }}/k8s-api-tunnel.sh
      Access model: connect to private nodes through the configured jump-host SSH path.
  delegate_to: localhost
  become: false
