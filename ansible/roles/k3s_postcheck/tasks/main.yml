---
# Postcheck runs on the bootstrap node because it always has the native kubeconfig.
- name: Read k3s node list
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    kind: Node
  register: k3s_nodes_info
  retries: 20
  delay: 10
  until: (k3s_nodes_info.resources | default([]) | length) > 0
  tags: [k3s, k3s_postcheck]

- name: Parse node list payload
  set_fact:
    k3s_nodes: "{{ k3s_nodes_info.resources }}"
  tags: [k3s, k3s_postcheck]

- name: Assert that three k3s nodes are registered
  assert:
    that:
      - (k3s_nodes | length) == 3
    fail_msg: >-
      Expected 3 nodes in the k3s control plane, got {{ k3s_nodes | length }}.
  tags: [k3s, k3s_postcheck]

- name: Assert that all k3s nodes report Ready
  assert:
    that:
      - >-
        (
          item.status.conditions
          | selectattr('type', 'equalto', 'Ready')
          | map(attribute='status')
          | first
        ) == 'True'
    fail_msg: "Node {{ item.metadata.name }} is not Ready."
  loop: "{{ k3s_nodes }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  tags: [k3s, k3s_postcheck]

- name: Read kubeconfig from bootstrap node
  slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig_raw
  tags: [k3s, k3s_postcheck]

# Prefer Terraform's API LB endpoint when present; direct ansible_host remains
# the fallback for single-cloud labs without the internal load balancer.
- name: Choose Kubernetes API endpoint for local kubeconfigs
  set_fact:
    k3s_operator_api_endpoint: "{{ cloud_runtime_metadata.get('k3s_api_endpoint', '') | default(ansible_host, true) }}"
  tags: [k3s, k3s_postcheck]

- name: Ensure local output directory exists
  file:
    path: "{{ k3s_postcheck_local_artifact_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  tags: [k3s, k3s_postcheck, artifacts]

- name: Write local kubeconfig
  template:
    dest: "{{ k3s_postcheck_local_artifact_dir }}/kubeconfig-gcp-k3s.yaml"
    src: kubeconfig-gcp-k3s.yaml.j2
    mode: "0600"
  delegate_to: localhost
  become: false
  tags: [k3s, k3s_postcheck, artifacts]

# Tunneled kubeconfig keeps TLS verification while using SSH for private APIs.
- name: Write tunneled kubeconfig
  template:
    dest: "{{ k3s_postcheck_local_artifact_dir }}/kubeconfig-gcp-k3s-tunneled.yaml"
    src: kubeconfig-gcp-k3s-tunneled.yaml.j2
    mode: "0600"
  delegate_to: localhost
  become: false
  tags: [k3s, k3s_postcheck, artifacts]

- name: Write Kubernetes API tunnel script
  template:
    dest: "{{ k3s_postcheck_local_artifact_dir }}/k8s-api-tunnel.sh"
    src: k8s-api-tunnel.sh.j2
    mode: "0755"
  delegate_to: localhost
  become: false
  tags: [k3s, k3s_postcheck, artifacts]

- name: Write Kubernetes operator environment helper
  template:
    dest: "{{ k3s_postcheck_local_artifact_dir }}/k8s-operator-env.sh"
    src: k8s-operator-env.sh.j2
    mode: "0644"
  delegate_to: localhost
  become: false
  tags: [k3s, k3s_postcheck, artifacts]

- name: Write cluster bootstrap summary
  template:
    dest: "{{ k3s_postcheck_local_artifact_dir }}/k3s-bootstrap-summary.txt"
    src: k3s-bootstrap-summary.txt.j2
    mode: "0644"
  delegate_to: localhost
  become: false
  tags: [k3s, k3s_postcheck, artifacts]
