---
# Resolve kubeconfig once per role run. Localhost prefers generated artifacts;
# remote hosts prefer /etc/rancher/k3s/k3s.yaml with a rendered fallback.
- name: Decide whether kubeconfig access runs in local operator mode
  set_fact:
    k3s_kubeconfig_access_use_local_artifact: "{{ inventory_hostname in k3s_kubeconfig_access_controller_hosts }}"

- name: Check for operator kubeconfig artifact on controller
  delegate_to: localhost
  become: false
  stat:
    path: "{{ k3s_kubeconfig_access_local_cluster_kubeconfig_path }}"
  register: k3s_local_cluster_kubeconfig_stat
  when: k3s_kubeconfig_access_use_local_artifact

- name: Fail when local operator kubeconfig artifact is missing
  fail:
    msg: >-
      Local Kubernetes operator mode requires the generated kubeconfig artifact
      at {{ k3s_kubeconfig_access_local_cluster_kubeconfig_path }}.
      Re-run ansible/k3s-cluster.yml to regenerate the operator artifacts.
  when:
    - k3s_kubeconfig_access_use_local_artifact
    - not (k3s_local_cluster_kubeconfig_stat.stat.exists | default(false))

- name: Set effective kubeconfig path for local operator mode
  set_fact:
    k3s_effective_kubeconfig_path: "{{ k3s_kubeconfig_access_local_cluster_kubeconfig_path }}"
  when:
    - k3s_kubeconfig_access_use_local_artifact
    - k3s_local_cluster_kubeconfig_stat.stat.exists | default(false)

- name: Check for node-local k3s kubeconfig
  stat:
    path: "{{ k3s_kubeconfig_access_remote_kubeconfig_path }}"
  register: k3s_remote_kubeconfig_stat
  when: not k3s_kubeconfig_access_use_local_artifact

- name: Check for operator kubeconfig artifact on controller for remote fallback
  delegate_to: localhost
  become: false
  stat:
    path: "{{ k3s_kubeconfig_access_local_cluster_kubeconfig_path }}"
  register: k3s_remote_fallback_local_cluster_kubeconfig_stat
  when:
    - not k3s_kubeconfig_access_use_local_artifact
    - not k3s_remote_kubeconfig_stat.stat.exists

- name: Read operator kubeconfig artifact from controller
  delegate_to: localhost
  become: false
  slurp:
    src: "{{ k3s_kubeconfig_access_local_cluster_kubeconfig_path }}"
  register: k3s_local_cluster_kubeconfig_raw
  when:
    - not k3s_kubeconfig_access_use_local_artifact
    - not k3s_remote_kubeconfig_stat.stat.exists
    - k3s_remote_fallback_local_cluster_kubeconfig_stat.stat.exists | default(false)

# Remote fallback rewrites the local artifact to the target host's API address.
# Fallback for delegated k8s tasks when /etc/rancher/k3s is unavailable.
- name: Render remote fallback kubeconfig
  template:
    src: remote-fallback-kubeconfig.yaml.j2
    dest: "{{ k3s_kubeconfig_access_remote_fallback_kubeconfig_path }}"
    mode: "0600"
  when:
    - not k3s_kubeconfig_access_use_local_artifact
    - not k3s_remote_kubeconfig_stat.stat.exists
    - k3s_remote_fallback_local_cluster_kubeconfig_stat.stat.exists | default(false)

- name: Fail when no usable kubeconfig is available
  fail:
    msg: >-
      No kubeconfig is available for k3s automation. Expected either
      {{ k3s_kubeconfig_access_remote_kubeconfig_path }} on the target host or
      {{ k3s_kubeconfig_access_local_cluster_kubeconfig_path }} on the controller.
  when:
    - not k3s_kubeconfig_access_use_local_artifact
    - not k3s_remote_kubeconfig_stat.stat.exists
    - not (k3s_remote_fallback_local_cluster_kubeconfig_stat.stat.exists | default(false))

- name: Set effective k3s kubeconfig path
  set_fact:
    k3s_effective_kubeconfig_path: >-
      {{
        k3s_kubeconfig_access_remote_kubeconfig_path
        if k3s_remote_kubeconfig_stat.stat.exists
        else k3s_kubeconfig_access_remote_fallback_kubeconfig_path
      }}
  when: not k3s_kubeconfig_access_use_local_artifact
