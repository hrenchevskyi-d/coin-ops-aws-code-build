---
# Resolve kubeconfig once. Localhost uses the exported file; remote hosts use /etc/rancher/k3s/k3s.yaml.
- name: Decide whether to use the local kubeconfig
  set_fact:
    k3s_kubeconfig_access_use_local_artifact: "{{ inventory_hostname in k3s_kubeconfig_access_controller_hosts }}"

- name: Check for local kubeconfig on controller
  delegate_to: localhost
  become: false
  stat:
    path: "{{ k3s_kubeconfig_access_local_cluster_kubeconfig_path }}"
  register: k3s_local_cluster_kubeconfig_stat
  when: k3s_kubeconfig_access_use_local_artifact

- name: Fail when local kubeconfig is missing
  fail:
    msg: >-
      Local Kubernetes access requires the generated kubeconfig
      at {{ k3s_kubeconfig_access_local_cluster_kubeconfig_path }}.
      Re-run ansible/k3s-cluster.yml to regenerate local access files.
  when:
    - k3s_kubeconfig_access_use_local_artifact
    - not (k3s_local_cluster_kubeconfig_stat.stat.exists | default(false))

- name: Set effective kubeconfig path for local mode
  set_fact:
    k3s_effective_kubeconfig_path: "{{ k3s_kubeconfig_access_local_cluster_kubeconfig_path }}"
  when:
    - k3s_kubeconfig_access_use_local_artifact
    - k3s_local_cluster_kubeconfig_stat.stat.exists | default(false)

- name: Check local k3s API tunnel
  command: nc -z -w 2 127.0.0.1 6443
  register: k3s_kubeconfig_access_local_tunnel_check
  changed_when: false
  failed_when: false
  when:
    - k3s_kubeconfig_access_runtime == 'k3s'
    - k3s_kubeconfig_access_use_local_artifact
    - k3s_local_cluster_kubeconfig_stat.stat.exists | default(false)

- name: Check local k3s API tunnel script
  stat:
    path: "{{ k3s_kubeconfig_access_local_artifact_dir }}/k8s-api-tunnel.sh"
  register: k3s_kubeconfig_access_local_tunnel_script_stat
  when:
    - k3s_kubeconfig_access_runtime == 'k3s'
    - k3s_kubeconfig_access_use_local_artifact
    - k3s_local_cluster_kubeconfig_stat.stat.exists | default(false)
    - k3s_kubeconfig_access_local_tunnel_check.rc | default(1) != 0

- name: Fail when local k3s API tunnel script is missing
  fail:
    msg: >-
      Local Kubernetes access uses {{ k3s_effective_kubeconfig_path }}, but
      127.0.0.1:6443 is not reachable and
      {{ k3s_kubeconfig_access_local_artifact_dir }}/k8s-api-tunnel.sh is
      missing. Re-run ansible/k3s-cluster.yml postcheck to regenerate access
      artifacts.
  when:
    - k3s_kubeconfig_access_runtime == 'k3s'
    - k3s_kubeconfig_access_use_local_artifact
    - k3s_local_cluster_kubeconfig_stat.stat.exists | default(false)
    - k3s_kubeconfig_access_local_tunnel_check.rc | default(1) != 0
    - not (k3s_kubeconfig_access_local_tunnel_script_stat.stat.exists | default(false))

- name: Start local k3s API tunnel
  command: "{{ k3s_kubeconfig_access_local_artifact_dir }}/k8s-api-tunnel.sh"
  async: 86400
  poll: 0
  changed_when: true
  when:
    - k3s_kubeconfig_access_runtime == 'k3s'
    - k3s_kubeconfig_access_use_local_artifact
    - k3s_local_cluster_kubeconfig_stat.stat.exists | default(false)
    - k3s_kubeconfig_access_local_tunnel_check.rc | default(1) != 0
    - k3s_kubeconfig_access_local_tunnel_script_stat.stat.exists | default(false)

- name: Wait for local k3s API tunnel
  command: nc -z -w 2 127.0.0.1 6443
  register: k3s_kubeconfig_access_local_tunnel_wait
  changed_when: false
  retries: 5
  delay: 2
  until: k3s_kubeconfig_access_local_tunnel_wait.rc == 0
  when:
    - k3s_kubeconfig_access_runtime == 'k3s'
    - k3s_kubeconfig_access_use_local_artifact
    - k3s_local_cluster_kubeconfig_stat.stat.exists | default(false)
    - k3s_kubeconfig_access_local_tunnel_check.rc | default(1) != 0

- name: Check for node-local k3s kubeconfig
  stat:
    path: "{{ k3s_kubeconfig_access_remote_kubeconfig_path }}"
  register: k3s_remote_kubeconfig_stat
  when: not k3s_kubeconfig_access_use_local_artifact

- name: Check for local kubeconfig on controller for remote fallback
  delegate_to: localhost
  become: false
  stat:
    path: "{{ k3s_kubeconfig_access_local_cluster_kubeconfig_path }}"
  register: k3s_remote_fallback_local_cluster_kubeconfig_stat
  when:
    - not k3s_kubeconfig_access_use_local_artifact
    - not k3s_remote_kubeconfig_stat.stat.exists

- name: Read local kubeconfig from controller
  delegate_to: localhost
  become: false
  slurp:
    src: "{{ k3s_kubeconfig_access_local_cluster_kubeconfig_path }}"
  register: k3s_local_cluster_kubeconfig_raw
  when:
    - not k3s_kubeconfig_access_use_local_artifact
    - not k3s_remote_kubeconfig_stat.stat.exists
    - k3s_remote_fallback_local_cluster_kubeconfig_stat.stat.exists | default(false)

# Fallback for delegated k8s tasks when /etc/rancher/k3s is unavailable.
- name: Render remote fallback kubeconfig
  template:
    src: remote-fallback-kubeconfig.yaml.j2
    dest: "{{ k3s_kubeconfig_access_remote_fallback_kubeconfig_path }}"
    mode: "0600"
  when:
    - not k3s_kubeconfig_access_use_local_artifact
    - not k3s_remote_kubeconfig_stat.stat.exists
    - k3s_remote_fallback_local_cluster_kubeconfig_stat.stat.exists | default(false)

- name: Fail when no usable kubeconfig is available
  fail:
    msg: >-
      No kubeconfig is available for k3s automation. Expected either
      {{ k3s_kubeconfig_access_remote_kubeconfig_path }} on the target host or
      {{ k3s_kubeconfig_access_local_cluster_kubeconfig_path }} on the controller.
  when:
    - not k3s_kubeconfig_access_use_local_artifact
    - not k3s_remote_kubeconfig_stat.stat.exists
    - not (k3s_remote_fallback_local_cluster_kubeconfig_stat.stat.exists | default(false))

- name: Set effective k3s kubeconfig path
  set_fact:
    k3s_effective_kubeconfig_path: >-
      {{
        k3s_kubeconfig_access_remote_kubeconfig_path
        if k3s_remote_kubeconfig_stat.stat.exists
        else k3s_kubeconfig_access_remote_fallback_kubeconfig_path
      }}
  when: not k3s_kubeconfig_access_use_local_artifact
