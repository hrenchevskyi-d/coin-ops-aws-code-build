---
# `kubernetes.core` roles in this repo can run in two modes:
# 1. Remote node mode: use the native kubeconfig on a k3s server.
# 2. Local mode: use the kubeconfig rendered by k3s_postcheck.
# Local mode is preferred for application and add-on playbooks.
k3s_kubeconfig_access_controller_hosts:
  - localhost
  - 127.0.0.1
k3s_kubeconfig_access_local_artifact_dir: "{{ repo_root ~ '/ansible/artifacts' }}"
k3s_kubeconfig_access_cloud_slug: "{{ my_cloud | default('cluster', true) }}"
k3s_kubeconfig_access_runtime: "{{ kubernetes_runtime | default('k3s', true) }}"
k3s_kubeconfig_access_default_local_path: "{{ k3s_kubeconfig_access_local_artifact_dir }}/kubeconfig-{{ k3s_kubeconfig_access_cloud_slug }}-{{ k3s_kubeconfig_access_runtime }}{{ '-tunneled' if k3s_kubeconfig_access_runtime == 'k3s' else '' }}.yaml"
k3s_kubeconfig_access_local_cluster_kubeconfig_path: "{{ lookup('env', 'K8S_KUBECONFIG_PATH') | default(cloud_runtime_metadata.get('eks_kubeconfig_path', k3s_kubeconfig_access_default_local_path), true) }}"
k3s_kubeconfig_access_remote_kubeconfig_path: /etc/rancher/k3s/k3s.yaml
k3s_kubeconfig_access_remote_fallback_kubeconfig_path: /tmp/coinops-k3s-kubeconfig.yaml
