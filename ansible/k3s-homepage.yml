---
# Homepage is an optional k3s add-on. It is separate from Coin-Ops app deploy so
# dashboard changes do not roll application workloads.
- name: Validate Homepage deployment contract
  hosts: localhost
  connection: local
  gather_facts: false
  pre_tasks:
    - name: Resolve runtime configuration for Homepage validation
      include_role:
        name: runtime_config
        public: true
      tags: [runtime_config, homepage]
  tasks:
    - name: Assert that a k3s control plane group exists
      assert:
        that:
          - "'role_k3s_server' in groups"
          - (groups['role_k3s_server'] | length) > 0
        fail_msg: >-
          Homepage deployment requires at least one host in role_k3s_server.

- name: Install Homepage and public ingress routing from the local operator machine
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  pre_tasks:
    - name: Resolve runtime configuration for Homepage deployment
      include_role:
        name: runtime_config
        public: true
      tags: [runtime_config, homepage]
    - name: Resolve effective kubeconfig for Homepage deployment
      include_role:
        name: k3s_kubeconfig_access
      tags: [runtime_config, homepage, kubeconfig]
  roles:
    - k3s_homepage
