---
# Validate config and secret resolution without touching remote hosts.
- name: Inspect resolved runtime configuration
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    runtime_config_control_plane_cloud: >-
      {{
        (
          lookup('file', playbook_dir ~ '/../terraform/config/clouds.json')
          | from_json
        ).clouds.control_plane | default('gcp', true)
      }}
    cloud: "{{ lookup('env', 'COINOPS_RUNTIME_CONFIG_CLOUD') | default(runtime_config_control_plane_cloud, true) }}"
  pre_tasks:
    - name: Resolve runtime configuration for inspection
      include_role:
        name: runtime_config
        public: true
      tags: [runtime_config]
  tasks:
    - name: Show resolved runtime configuration
      debug:
        msg:
          cloud: "{{ cloud }}"
          secret_backend: "{{ secret_backend }}"
          runtime_backend: "{{ runtime_backend }}"
          app_domain: "{{ app_domain }}"
          tls_mode: "{{ tls_mode }}"
          certbot_staging: "{{ certbot_staging }}"
          image_registry: "{{ image_registry }}"
          image_tag: "{{ image_tag }}"
          gcp_project: "{{ gcp_project }}"
          aws_region: "{{ aws_region }}"
          azure_key_vault_name: "{{ azure_key_vault_name }}"
          k3s_api_endpoint: "{{ cloud_runtime_metadata.get('k3s_api_endpoint', '') }}"
          headlamp_ingress_ip: "{{ cloud_runtime_metadata.get('headlamp_ingress_ip', '') }}"
          homepage_public_ip: "{{ cloud_runtime_metadata.get('homepage_public_ip', '') }}"
          homepage_public_endpoint: "{{ cloud_runtime_metadata.get('homepage_public_endpoint', '') }}"
          public_ingress_load_balancer_dns_name: "{{ cloud_runtime_metadata.get('public_ingress_load_balancer_dns_name', '') }}"
          homepage_public_host: "{{ cloud_runtime_metadata.get('homepage_public_host', '') }}"
          tailscale_enabled: "{{ tailscale_enabled }}"
      tags: [runtime_config]
